[tool.poetry]
name = "adjudicator"
description = "Software defect prediction model for DAT-330"
version = "0.1.0"
authors = ["EOF-D <END-OFD@pm.me>"]
packages = [{ include = "adjudicator" }]

[tool.poetry.dependencies]
python = "^3.12"
flake8 = "^7.1.1"
pep8-naming = "^0.14.1"
flake8-docstrings = "^1.7.0"
pyright = "^1.1.393"
aiofiles = "^25.1.0"
pandas = "^3.0.1"
attrs = "^25.4.0"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
black = "^26.5.1"

[tool.poetry.group.dev.dependencies]
black = ">=26.5.1,<27.0.0"
isort = "^5.13.2"
pandas-stubs = "^3.0.5"

[tool.pyright]
typeCheckingMode = "strict"
include = ["adjudicator", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
